<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>点前 — 抹茶を点てる</title>
<style>
  :root {
    --sumi: #141311;      /* 墨 */
    --urushi: #1d1a17;    /* 漆 */
    --washi: #e2dacb;     /* 和紙 */
    --matcha: #667a3c;    /* 抹茶 */
    --koke: #3a4a28;      /* 苔 */
    --awa: #a9b88a;       /* 泡 */
    --kincha: #b08d57;    /* 金茶 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--sumi) url("images/game/chashitsu.webp") center / cover no-repeat;
    color: var(--washi);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #app {
    position: relative; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    /* 文字が読めるよう、上下を闇に沈める */
    background: linear-gradient(to bottom, rgba(20,19,17,.72), rgba(20,19,17,.2) 28%, rgba(20,19,17,.3) 62%, rgba(20,19,17,.92) 88%);
  }

  /* 縦書きのタイトル（左上） */
  .title {
    position: absolute; top: 20px; left: 18px;
    writing-mode: vertical-rl;
    font-size: 22px; letter-spacing: .35em; line-height: 1;
    color: var(--washi); opacity: .85;
  }
  .title small {
    display: block; margin-right: 8px; padding-top: 2px;
    font-size: 11px; letter-spacing: .3em; color: var(--kincha); opacity: .9;
  }

  /* 残り時間（右上） */
  .timer {
    position: absolute; top: 20px; right: 22px;
    font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums;
    color: var(--washi);
  }
  .timer small { display: block; font-size: 13px; letter-spacing: .3em; text-align: right; margin-top: 6px; opacity: .7; }

  canvas { display: block; touch-action: none; }

  /* 茶人のひとこと（縦書き、賛のように添える） */
  .word {
    position: absolute; left: 0; top: 0;
    writing-mode: vertical-rl;
    font-size: 14px; letter-spacing: .32em; line-height: 1; white-space: nowrap;
    color: var(--washi); text-shadow: 0 0 6px #000, 0 0 2px #000;
    padding: 2px 0 2px 9px; border-left: 1px solid var(--kincha);
    pointer-events: none;
    opacity: 0; transform: translateY(-6px);
    transition: opacity .6s, transform .6s;
  }
  .word.show { opacity: .92; transform: none; }

  .hud {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 22px 24px calc(28px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .count {
    font-size: 30px; line-height: 1; color: var(--awa);
    font-variant-numeric: tabular-nums;
  }
  .count span { font-size: 14px; margin-left: 6px; color: var(--washi); opacity: .7; }
  .count #turns { font-size: inherit; margin: 0; color: inherit; opacity: 1; }
  .hint { font-size: 14px; opacity: .7; letter-spacing: .1em; }

  button {
    appearance: none; border: 1px solid rgba(226,218,203,.7); background: rgba(20,19,17,.35);
    color: var(--washi); font: inherit; font-size: 18px; letter-spacing: .3em;
    padding: 14px 40px 14px 44px; border-radius: 3px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  button:active, button:focus-visible { background: var(--washi); color: var(--sumi); outline: none; }

  /* 評価画面 */
  .result {
    position: absolute; inset: 0;
    background: linear-gradient(rgba(29,26,23,.9), rgba(20,19,17,.97)), url("images/game/chashitsu.webp") center / cover no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 28px; text-align: center; gap: 12px;
    opacity: 0; visibility: hidden; transition: opacity .8s;
  }
  .result.show { opacity: 1; visibility: visible; }
  .result .rank {
    font-size: clamp(36px, 11vw, 60px); letter-spacing: .12em; line-height: 1.2;
    color: var(--washi);
  }

  /* 評価画面の茶人 */
  .stage { position: relative; flex-shrink: 0; height: min(30vh, 250px); aspect-ratio: 448 / 576; }
  .stage .face {
    position: absolute; inset: 0; width: 100%; height: 100%;
    transform-origin: 50% 100%; pointer-events: none;
  }
  .result.show .stage { animation: enter 1.2s ease-out both; }
  .stage[data-mood="sigh"] .face  { animation: droop 4.2s ease-in-out infinite; }
  .stage[data-mood="nod"] .face   { animation: nod 3.2s ease-in-out infinite; }
  .stage[data-mood="drink"] .face { animation: breathe 4.4s ease-in-out infinite; }
  .stage[data-mood="smile"] .face { animation: breathe 4s ease-in-out infinite; }
  .stage[data-mood="joy"] .face   { animation: chuckle .9s ease-in-out infinite; }

  /* ほうびの菓子（少しだけ、かわいいもの） */
  .treat {
    position: absolute; right: -24%; bottom: -3%; width: 52%;
    opacity: 0; pointer-events: none;
  }
  .stage.rewarded .treat { animation: serve 1s 1s cubic-bezier(.3,1.4,.5,1) both; }
  .stage i {
    position: absolute; right: -12%; top: 46%; font-style: normal; font-size: 15px;
    color: var(--kincha); opacity: 0;
  }
  .stage[data-mood="joy"] i { animation: floatup 2.8s 1.8s ease-out infinite; }

  .voice { font-size: 15px; letter-spacing: .2em; color: var(--kincha); min-height: 1.4em; }
  .voice::before { content: "「"; opacity: .7; }
  .voice::after { content: "」"; opacity: .7; }
  .result .comment { font-size: 15px; line-height: 1.8; opacity: .85; max-width: 22em; }
  .result .stats { font-size: 14px; opacity: .7; letter-spacing: .1em; }
  .rikyu { width: min(300px, 80vw); }
  .rikyu .label { font-size: 14px; letter-spacing: .4em; opacity: .75; }
  .rikyu .value {
    font-size: clamp(44px, 15vw, 76px); line-height: 1; color: var(--awa);
    font-variant-numeric: tabular-nums;
  }
  .rikyu .value small { font-size: .35em; margin-left: 4px; color: var(--washi); }
  .rikyu .bar { height: 1px; background: rgba(226,218,203,.2); margin-top: 12px; }
  .rikyu .bar i { position: relative; display: block; height: 100%; width: 0; background: var(--kincha); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .rikyu .bar i::after {     /* 目盛りのしるし */
    content: ""; position: absolute; right: -4px; top: -3px; width: 7px; height: 7px;
    background: var(--kincha); transform: rotate(45deg);
  }
  .result button { margin-top: 8px; }

  @keyframes enter   { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: none; } }
  @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.006, 1.012); } }
  @keyframes droop   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.2%); } }
  @keyframes nod     { 0%, 55%, 100% { transform: translateY(0); } 70% { transform: translateY(1.6%); } 85% { transform: translateY(.2%); } }
  @keyframes chuckle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.9%); } }
  @keyframes serve   { 0% { opacity: 0; transform: translateY(14px) scale(.85); } 100% { opacity: 1; transform: none; } }
  @keyframes floatup { 0% { opacity: 0; transform: translateY(0); } 25% { opacity: .9; } 100% { opacity: 0; transform: translate(8px, -40px); } }

  /* 横向きのスマホ：茶人を左、評価を右に並べる */
  @media (orientation: landscape) {
    body { background-image: url("images/game/chashitsu_wide.webp"); }
  }
  @media (orientation: landscape) and (max-height: 560px) {
    .result {
      display: grid; grid-template-columns: auto minmax(0, 24em); grid-auto-rows: min-content;
      align-content: center; justify-content: center; justify-items: center;
      column-gap: 56px; row-gap: 6px; padding: 12px 28px;
    }
    .result > * { grid-column: 2; }
    .stage { grid-column: 1; grid-row: 1 / span 6; align-self: center; height: min(80vh, 320px); }
    .result .rank { font-size: 32px; }
    .result .comment { font-size: 13px; line-height: 1.6; }
    .rikyu .value { font-size: 44px; }
    .result button { margin-top: 4px; padding: 10px 36px 10px 40px; font-size: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .result, .rikyu .bar i, .word { transition: none; }
    .stage, .stage .face, .stage i { animation: none !important; }
    .stage.rewarded .treat { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="title">抹茶を点てる<small>茶人の御前にて</small></div>
  <div class="timer"><span id="time">10.0</span><small>秒</small></div>
  <canvas id="c"></canvas>
  <div class="word" id="word"></div>
  <div class="hud">
    <div class="count"><span id="turns">0</span><span>回転</span></div>
    <div class="hint" id="hint">茶筅を回すように、茶碗の上でぐるぐる</div>
    <button id="start">点前をはじめる</button>
  </div>

  <div class="result" id="result">
    <div class="rank" id="rank"></div>
    <div class="stage" id="stage">
      <img class="face" id="face" alt="茶人" draggable="false">
      <img class="treat" src="images/game/wagashi.webp" alt="" draggable="false">
      <i>♪</i>
    </div>
    <div class="voice" id="voice"></div>
    <div class="comment" id="comment"></div>
    <div class="stats" id="stats"></div>
    <div class="rikyu">
      <div class="label">利休度</div>
      <div class="value"><span id="rikyu">0</span><small>％</small></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <button id="again">もう一服</button>
  </div>
</div>

<script>
(() => {
  const DURATION = 10;                  // 制限時間（秒）
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 茶人の絵（ComfyUI で生成し、GIMP で調整） ---------- */
  const ASPECT = 448 / 576;             // どの表情も同じ大きさ・同じ位置で描いてある
  const FACES = {};
  ['idle', 'blink', 'watch', 'impressed', 'sigh', 'glare', 'nod', 'drink', 'smile', 'joy'].forEach(n => {
    const im = new Image(); im.src = `images/game/tyajin_${n}.webp`; FACES[n] = im;
  });
  const sweet = new Image(); sweet.src = 'images/game/wagashi.webp';
  const ready = im => im.complete && im.naturalWidth > 0;

  let W, H, cx, cy, R, dpr;
  let playing = false, endAt = 0, angleAcc = 0, lastAngle = null, taps = 0;
  let turns = 0, foam = 0, whisk = { a: 0, active: false }, particles = [];
  let motes = [], lastT = 0, spin = 0, speed = 0;
  const master = { x: 0, y: 0, h: 0, nod: 0, lean: 0, nextBlink: 2500, blinkUntil: 0, awedUntil: 0, lastSpurt: false };
  const bird = { x: 0, y: 0, w: 0, hop: 0, vy: 0 };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const side = W > H * 1.15;          // 横画面
    cx = W / 2; cy = H * (side ? .44 : .52); R = Math.min(W, H) * 0.3;

    // 茶人の居場所：縦画面は茶碗の向こう正面、横画面は茶碗の左
    if (side) {
      master.h = Math.min(H * .7, cy + R - 8);
      master.x = cx - R * 1.18 - master.h * ASPECT * .5; master.y = cy + R;
    } else {
      master.y = cy - R * .5;
      master.h = Math.min(master.y - 10, W * .95 / ASPECT);
      master.x = cx;
    }
    // 菓子皿は茶碗の右手前に
    bird.w = R * .62;
    bird.x = Math.min(cx + R * 1.02, W - bird.w / 2 - 8); bird.y = cy + R * 1.12;

    const w = $('word');
    w.style.left = (master.x + master.h * ASPECT * .27) + 'px';
    w.style.top = Math.max(master.y - master.h * .88, side ? 12 : 96) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // 障子のあかりに浮かぶ、ちり
  if (!calm) for (let i = 0; i < 16; i++) motes.push({
    x: Math.random(), y: Math.random(), r: .5 + Math.random() * 1.1,
    vx: (Math.random() - .3) * .006, vy: -.002 - Math.random() * .006, ph: Math.random() * 6.28
  });

  /* ---------- 茶人のひとこと ---------- */
  let wordTimer = 0;
  function say(text, ms) {
    const w = $('word');
    clearTimeout(wordTimer);
    if (!text) { w.classList.remove('show'); return; }
    w.textContent = text; w.classList.add('show');
    if (ms) wordTimer = setTimeout(() => w.classList.remove('show'), ms);
  }
  const IDLE_LINES = ['点ててみよ', '手首は、やわらかく', '一期一会じゃ'];
  let idleLine = 0;
  setInterval(() => { if (!playing && !$('result').classList.contains('show')) say(IDLE_LINES[++idleLine % IDLE_LINES.length]); }, 5200);
  say(IDLE_LINES[0]);
  const REMARKS = { 3: 'うむ', 8: 'その調子', 14: 'よい香りだ', 22: 'ほう……', 30: '見事', 40: '……まさか' };

  /* ---------- 描画 ---------- */
  function drawMaster(t, dt) {
    master.nod *= Math.pow(.9, dt / 16);
    const target = calm ? 0 : (playing && whisk.active ? Math.sin(whisk.a) * .018 : 0);
    master.lean += (target - master.lean) * Math.min(1, dt / 200);

    // いまの表情を決める
    if (t > master.nextBlink) { master.blinkUntil = t + 150; master.nextBlink = t + 2600 + Math.random() * 3400; }
    let name = t < master.blinkUntil ? 'blink' : 'idle';
    if (playing) name = t < master.awedUntil ? 'impressed' : 'watch';
    let im = FACES[name];
    if (!ready(im)) im = FACES.idle;
    if (!ready(im)) return;

    const h = master.h, w = h * ASPECT;
    const breath = calm ? 0 : Math.sin(t / 900);
    ctx.save();
    ctx.translate(master.x, master.y + master.nod * h * .018);
    ctx.rotate(master.lean); ctx.scale(1 - breath * .003, 1 + breath * .006);
    ctx.drawImage(im, -w / 2, -h, w, h);
    ctx.restore();
  }

  function drawBird(dt) {
    if (bird.hop < 0 || bird.vy < 0) {
      bird.hop += bird.vy * dt; bird.vy += .00001 * dt;
      if (bird.hop >= 0) { bird.hop = 0; bird.vy = 0; }
    }
    if (!ready(sweet)) return;
    const w = bird.w, h = w * sweet.naturalHeight / sweet.naturalWidth;
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(bird.x, bird.y + h * .42, w * .5, h * .2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.drawImage(sweet, bird.x - w / 2, bird.y - h / 2 + bird.hop * w, w, h);
  }

  function draw(t) {
    const dt = Math.min(50, t - lastT || 16); lastT = t;
    ctx.clearRect(0, 0, W, H);

    // ちり
    motes.forEach(m => {
      m.x += m.vx * dt / 1000; m.y += m.vy * dt / 1000;
      if (m.y < -.02) { m.y = 1.02; m.x = Math.random(); }
      if (m.x > 1.02) m.x = -.02; if (m.x < -.02) m.x = 1.02;
      ctx.fillStyle = `rgba(226,218,203,${.1 + .12 * (1 + Math.sin(t / 1700 + m.ph)) / 2})`;
      ctx.beginPath(); ctx.arc(m.x * W, m.y * H, m.r, 0, Math.PI * 2); ctx.fill();
    });

    // 回す速さ（茶人が目を見はる）
    speed += (spin / dt - speed) * .12; spin = 0;
    if (playing && speed > .013) master.awedUntil = t + 700;

    drawMaster(t, dt);

    // 畳の影
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath(); ctx.ellipse(cx, cy + R * 1.05, R * 1.25, R * 0.28, 0, 0, Math.PI * 2); ctx.fill();

    // 茶碗の外側（楽茶碗ふう）
    const bowl = ctx.createRadialGradient(cx - R * .4, cy - R * .5, R * .2, cx, cy, R * 1.3);
    bowl.addColorStop(0, '#4d4038'); bowl.addColorStop(1, '#171210');
    ctx.fillStyle = bowl;
    ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.18, R * 1.05, 0, 0, Math.PI * 2); ctx.fill();

    // 口縁
    ctx.strokeStyle = 'rgba(226,218,203,.22)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.05, R * .93, 0, 0, Math.PI * 2); ctx.stroke();

    // 液面：泡立ちに応じて色が変わる
    const f = Math.min(foam, 1);
    const lerp = (a, b, k) => Math.round(a + (b - a) * k);
    const col = `rgb(${lerp(62, 165, f)},${lerp(96, 186, f)},${lerp(46, 126, f)})`;
    const liq = ctx.createRadialGradient(cx - R * .25, cy - R * .3, R * .1, cx, cy, R);
    liq.addColorStop(0, col); liq.addColorStop(1, `rgb(${lerp(38,98,f)},${lerp(68,124,f)},${lerp(30,64,f)})`);
    ctx.fillStyle = liq;
    ctx.beginPath(); ctx.ellipse(cx, cy, R, R * .88, 0, 0, Math.PI * 2); ctx.fill();

    // よく泡立つと、仕上げの「の」の字が浮かぶ
    if (foam > .2) {
      ctx.save(); ctx.globalAlpha = Math.min(.45, (foam - .2) * 1.1);
      ctx.fillStyle = 'rgb(226,234,206)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `${R * 1.05}px "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif`;
      ctx.translate(cx, cy); ctx.scale(1, .88); ctx.fillText('の', 0, R * .04);
      ctx.restore();
    }

    // 渦（回転中）
    if (playing) {
      ctx.save(); ctx.beginPath(); ctx.ellipse(cx, cy, R, R * .88, 0, 0, Math.PI * 2); ctx.clip();
      ctx.strokeStyle = 'rgba(226,218,203,.16)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        for (let a = 0; a < Math.PI * 4; a += .15) {
          const r = (a / (Math.PI * 4)) * R * .9;
          const th = a + whisk.a + i * 2.1;
          const x = cx + Math.cos(th) * r, y = cy + Math.sin(th) * r * .88;
          a === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    // 泡の粒
    particles.forEach(p => {
      ctx.fillStyle = `rgba(226,234,206,${p.life * .75})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      p.life -= .02; p.x += p.vx; p.y += p.vy;
    });
    particles = particles.filter(p => p.life > 0);

    // 湯気
    if (foam > .25 && !calm) {
      ctx.save(); ctx.strokeStyle = `rgba(226,218,203,${Math.min(.14, foam * .12)})`; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        for (let s = 0; s <= 1; s += .1) {
          const x = cx + i * R * .3 + Math.sin(s * 5 + t / 900 + i * 2) * R * .07 * s, y = cy - R * .2 - s * R * .9;
          s === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    drawBird(dt);

    // 茶筅
    if (playing) {
      const wx = cx + Math.cos(whisk.a) * R * .45, wy = cy + Math.sin(whisk.a) * R * .4;
      ctx.strokeStyle = '#b9a37c'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(wx, wy - R * .05); ctx.lineTo(wx + R * .25, wy - R * 1.1); ctx.stroke();
      ctx.lineWidth = 1;
      for (let i = -4; i <= 4; i++) {
        ctx.beginPath(); ctx.moveTo(wx, wy - R * .15);
        ctx.lineTo(wx + i * R * .04, wy + R * .08); ctx.stroke();
      }
    }

    if (playing) {
      const left = Math.max(0, (endAt - t) / 1000);
      $('time').textContent = left.toFixed(1);
      if (left < 3 && !master.lastSpurt) { master.lastSpurt = true; say('あと少し', 1800); }
      if (left <= 0) finish();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ---------- 入力 ---------- */
  function addFoam(n) {
    foam = Math.min(1.2, foam + n * .012);
    const a = Math.random() * Math.PI * 2, r = Math.random() * R * .8;
    particles.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * .88,
      r: 1 + Math.random() * 3, vx: (Math.random() - .5) * .6, vy: -.3 - Math.random() * .4, life: 1 });
  }
  function remark() {                   // 節目の回転で、茶人がうなずき、ひとこと
    if (!REMARKS[turns]) return;
    say(REMARKS[turns], 1800);
    if (calm) return;
    master.nod = 1;
    if (bird.hop === 0 && bird.vy === 0) bird.vy = -.0012;   // 菓子の小鳥も、こっそり跳ねる
  }
  function angleAt(e) { return Math.atan2(e.clientY - cy, e.clientX - cx); }

  canvas.addEventListener('pointerdown', e => {
    if (!playing) return;
    canvas.setPointerCapture(e.pointerId);
    lastAngle = angleAt(e); whisk.active = true;
    taps++; addFoam(1);
    if (navigator.vibrate) navigator.vibrate(8);
  });
  canvas.addEventListener('pointermove', e => {
    if (!playing || lastAngle === null) return;
    const a = angleAt(e);
    let d = a - lastAngle;
    if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2;
    lastAngle = a; whisk.a = a;
    angleAcc += Math.abs(d); spin += Math.abs(d);
    const t = Math.floor(angleAcc / (Math.PI * 2));
    if (t !== turns) { turns = t; $('turns').textContent = turns; addFoam(2); remark(); }
  });
  const up = () => { lastAngle = null; whisk.active = false; };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);

  /* ---------- 進行 ---------- */
  function start() {
    playing = true; angleAcc = 0; turns = 0; taps = 0; foam = 0; particles = [];
    speed = 0; spin = 0; master.awedUntil = 0; master.lastSpurt = false;
    $('turns').textContent = '0';
    $('start').hidden = true; $('hint').textContent = '茶筅を回して、泡を立てる';
    $('result').classList.remove('show');
    endAt = performance.now() + DURATION * 1000;
    say('参られよ', 1600);
  }
  function finish() {
    playing = false; up();
    $('start').hidden = false; $('time').textContent = '0.0';
    $('hint').textContent = '茶筅を回すように、茶碗の上でぐるぐる';
    say('');
    showResult(turns, taps);
  }

  // [回転数, 位, 講評, 茶人の表情, 茶人のひとこと, ほうびの菓子]
  const RANKS = [
    [0,  '緑の水',     '茶筅は飾りではありません。まずは手を動かしましょう。', 'sigh', '……湯が、冷めるぞ', false],
    [4,  '見習い',     '泡はまばら。しかし志は伝わります。明日も点てましょう。', 'glare', '精進されよ', false],
    [10, '茶人見習い', 'きめの粗い泡が立ちました。稽古を重ねれば形になります。', 'nod', '悪くは、ない', false],
    [18, '茶人',       '細かな泡がふわりと立ち、香りが立ちのぼりました。一服、見事です。', 'drink', '……うむ。旨い', false],
    [28, '宗匠',       '泡は絹のごとく、茶碗は静かに湯気をたてる。侘びの境地です。', 'smile', '結構なお点前で', true],
    [40, '利休再来',   '一碗に宇宙を見ました。あなたの点前に、時が止まりました。', 'joy', 'わしの負けじゃ', true],
  ];

  function showResult(turns, taps) {
    let rank = RANKS[0];
    for (const r of RANKS) if (turns >= r[0]) rank = r;
    // 利休度：回転数が主、タップ数が少し、そして一期一会の揺らぎ
    let rikyu = Math.min(100, Math.round(turns * 2.3 + taps * .4 + (Math.random() * 6 - 3)));
    rikyu = Math.max(0, rikyu);
    if (turns === 0) rikyu = 0;
    $('rank').textContent = rank[1];
    $('comment').textContent = rank[2];
    $('voice').textContent = rank[4];
    $('stats').textContent = `${turns} 回転 ／ ${taps} タップ`;
    $('rikyu').textContent = '0'; $('bar').style.width = '0';

    // 茶人の反応
    const stage = $('stage');
    stage.dataset.mood = rank[3];
    stage.classList.remove('rewarded'); void stage.offsetWidth;
    stage.classList.toggle('rewarded', rank[5]);
    $('face').src = FACES[rank[3]].src;

    $('result').classList.add('show');
    // カウントアップ演出
    const t0 = performance.now(), dur = 1200;
    (function tick(now) {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      $('rikyu').textContent = Math.round(rikyu * e);
      $('bar').style.width = rikyu + '%';
      if (k < 1) requestAnimationFrame(tick);
    })(t0);
  }

  $('start').addEventListener('click', start);
  $('again').addEventListener('click', () => { $('result').classList.remove('show'); start(); });
})();
</script>
</body>
</html>
